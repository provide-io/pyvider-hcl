# wrknv configuration for pyvider-hcl

[project]
name = "pyvider-hcl"
description = "HCL parser and writer for Python"

[tools]
uv = "latest"

[siblings]
patterns = [
    "pyvider-cty",        # CTY type system
    "provide-foundation", # Foundation telemetry
    "provide-testkit",    # Testing utilities
    "wrknv",              # Environment manager
]

[settings]
python_version = ">=3.11"