#
# pyvider-hcl | Continuous Integration Workflow
#
# This workflow runs a comprehensive suite of checks on every push and pull
# request to the main branch, ensuring code quality, correctness, and security.
# It leverages `uv` for high-performance dependency management and caching.
#

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel any in-progress runs of the same workflow on the same branch
# to save resources and provide faster feedback.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Build & Test | Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test against all supported Python versions declared in pyproject.toml
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up uv and Python environment
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
          # Cache dependencies to speed up subsequent runs. The cache is keyed
          # by OS, Python version, and the hash of the lock file.
          cache-key: ${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock') }}

      - name: 📦 Install all dependencies from lockfile
        run: uv sync --all-groups --dev

      - name: ✨ Check formatting with Ruff
        run: uv run ruff format --check .

      - name: 🧹 Lint with Ruff
        run: uv run ruff check .

      - name: 🔒️ Security scan with Bandit
        run: uv run bandit -r src/

      - name: 🧐 Static type checking with mypy
        run: uv run mypy src/

      - name: 🧪 Run tests with Pytest and generate coverage
        run: uv run pytest --cov=pyvider.hcl --cov-report=xml

      - name: ⬆️ Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          # The CODECOV_TOKEN is not strictly required for public repositories,
          # but it is best practice for reliable uploads.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true
